 if(!S.sound)return;const a=ac();if(!a)return;
 const s=a.currentTime+t,o=a.createOscillator(),g=a.createGain();
 o.type="sine";o.frequency.setValueAtTime(170,s);o.frequency.exponentialRampToValueAtTime(38,s+.3);
 g.gain.setValueAtTime(.9,s);g.gain.exponentialRampToValueAtTime(.001,s+.4);
 o.connect(g);g.connect(a.destination);o.start(s);o.stop(s+.42);
}

/* ---------- utilidades ---------- */
function view(h){$.innerHTML=h}
function teamList(t){return S.players.filter(p=>p.t===t)}
function scoreBar(){return `<div class="score" id="sc"><div class="a"><span>Azul</span><span>${S.score[0]}</span></div><div class="r"><span>Rojo</span><span>${S.score[1]}</span></div></div>`}
function steps(n){return `<div class="steps">${["1 Jugadores","2 Secciones","3 ¡A jugar!"].map((t,i)=>`<span class="${i===n?"on":""}">${t}</span>`).join("")}</div>`}
function draw(n){
 const ls=CATS.filter(c=>S.cfg.cats.has(c.id)).map(c=>shuf(pool(c))),out=[];
 for(let i=0;out.length<n&&ls.some(l=>l.length>i);i++)for(const l of ls)if(l[i]&&out.length<n&&!out.includes(l[i]))out.push(l[i]);
 return shuf(out);
}
function total(){return new Set(CATS.filter(c=>S.cfg.cats.has(c.id)).flatMap(pool)).size}

/* ---------- preparación ---------- */
function home(){
 clearInterval(timer);S.playing=false;S.paused=false;
 document.body.style.setProperty("--tc","var(--sol)");
 view(`<div class="home">${logo(150)}${wordmark()}
 <p class="sub">El juego de equipos para adivinar en tres rondas con las mismas cartas.</p>
 <div class="modes"><div><i>🗣️</i><b>Describe</b><small>Ronda 1</small></div><div><i>☝️</i><b>Una palabra</b><small>Ronda 2</small></div><div><i>🎭</i><b>Mímica</b><small>Ronda 3</small></div></div></div>
 <button class="btn" id="pl" style="font-size:1.4rem;padding:20px;margin-top:auto">Jugar</button>
 <button class="btn alt" id="hw">Cómo se juega</button>
 <p class="foot">De 4 a muchos jugadores · Gratis y sin registro<br>Para jugar en grupo, en cualquier sitio.</p>`);
 document.getElementById("pl").onclick=()=>{ac();setup()};
 document.getElementById("hw").onclick=how;
}
function how(){
 view(`<h1>Cómo se juega</h1>
 <ol class="how">
 <li><b>Formad dos equipos</b><span>Añade a todos los jugadores y elige las secciones de cartas que queréis.</span></li>
 <li><b>Un turno dura 30, 40 o 60 segundos (lo eliges tú)</b><span>Pasa el móvil. Quien tenga el turno hace que su equipo adivine cuantas más cartas mejor. Pulsa ✓ al acertar o ✗ para pasar.</span></li>
 <li><b>Tres rondas con las mismas cartas</b><span>Ronda 1: describe sin decir la palabra (pasar cuesta 5 s). Ronda 2: solo una palabra. Ronda 3: solo mímica.</span></li>
 <li><b>Gana quien más puntos sume</b><span>Cada acierto vale 1 punto. Memoriza las cartas: ¡volverán a salir!</span></li></ol>
 <button class="btn" id="bk" style="margin-top:auto">¡Entendido!</button>`);
 document.getElementById("bk").onclick=home;
}
function setup(){
 clearInterval(timer);
 const tl=t=>S.players.map((p,i)=>({p,i})).filter(x=>x.p.t===t);
 view(`<div class="top"><button class="mini" id="hm">← Inicio</button><b class="mark">Funzy</b></div>${steps(0)}
 <p>Añade a los jugadores. Toca un nombre para quitarlo. Hacen falta al menos 2 por equipo.</p>
 <div class="row"><input id="nm" placeholder="Nombre del jugador" maxlength="16" autocomplete="off"><button class="btn" id="add" style="flex:1">Añadir</button></div>
 <div class="msg" role="status">${esc(S.msg)}</div>
 <div class="teams">${[0,1].map(t=>`<div class="team t${t}"><b>${TEAMS[t]}</b>${tl(t).map(x=>`<button class="pc" data-r="${x.i}" aria-label="Quitar a ${esc(x.p.n)}">${esc(x.p.n)} ✕</button>`).join("")||"<p>Sin jugadores</p>"}</div>`).join("")}</div>
 <button class="btn alt" id="mix" ${S.players.length<2?"disabled":""}>Mezclar equipos</button>
 <button class="btn" id="go" style="margin-top:auto" ${teamList(0).length<2||teamList(1).length<2?"disabled":""}>Siguiente: elegir secciones</button>`);
 const nm=document.getElementById("nm");
 const add=()=>{const n=nm.value.trim();if(!n)return;
  if(S.players.some(p=>p.n.toLowerCase()===n.toLowerCase())){S.msg="Ese jugador ya existe. Elige otro nombre.";return setup()}
  S.msg="";S.players.push({n,t:teamList(0).length<=teamList(1).length?0:1});save();setup();document.getElementById("nm").focus()};
 document.getElementById("add").onclick=add;
 nm.onkeydown=e=>{if(e.key==="Enter")add()};
 $.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{S.players.splice(+b.dataset.r,1);S.msg="";save();setup()});
 document.getElementById("mix").onclick=()=>{S.players=shuf(S.players).map((p,i)=>({...p,t:i%2}));save();setup()};
 document.getElementById("hm").onclick=home;
 document.getElementById("go").onclick=config;
}
function config(){
 const n=total(),c=S.cfg;
 view(`<h1>Secciones</h1>${steps(1)}
 <p>Activa las que quieras. Las cartas se reparten a partes iguales entre las secciones elegidas y cambian en cada partida.</p>
 <div class="tiles">${CATS.map(x=>{const L=LOOK[x.id],on=c.cats.has(x.id);return `<button class="tile${on?" on":""}" aria-pressed="${on}" data-k="c" data-v="${x.id}" style="--a:${L[1]};--b:${L[2]}"><i class="chk">${on?"✓":""}</i><span class="d1">${L[3]}</span><span class="d2">${L[4]}</span><span class="em">${L[0]}</span><b>${x.n}</b><small>${pool(x).length} cartas</small></button>`}).join("")}</div>
 <div class="row"><button class="btn alt" data-k="all">Todas</button><button class="btn alt" data-k="none">Ninguna</button></div>
 <h2>Cartas por partida</h2>
 <div class="chips">${NS.map(x=>`<button class="chip${c.n===x?" on":""}" aria-pressed="${c.n===x}" data-k="n" data-v="${x}">${x}</button>`).join("")}</div>
 <h2>Dificultad</h2><div class="chips">${DF.map(([k,l])=>`<button class="chip${c.d===k?" on":""}" aria-pressed="${c.d===k}" data-k="d" data-v="${k}">${l}</button>`).join("")}</div>
 <h2>Tiempo por turno</h2><div class="chips">${TS.map(x=>`<button class="chip${c.t===x?" on":""}" aria-pressed="${c.t===x}" data-k="t" data-v="${x}">${x} s</button>`).join("")}</div>
 <p${n&&n<c.n?' style="color:var(--rojo);font-weight:700"':""}>${!n?"Elige al menos una sección.":n<c.n?`Con esta selección solo hay ${n} cartas y necesitas ${c.n}. Añade otra sección para poder jugar.`:`Hay ${n} cartas disponibles con esta selección.`}</p>
 <div class="row sticky"><button class="btn alt" data-k="back">Atrás</button><button class="btn" data-k="play" ${n>=c.n?"":"disabled"}>Jugar</button></div>`);
 $.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{
  const k=b.dataset.k,v=b.dataset.v;
  if(k==="back")return setup();
  if(k==="play"){if(total()<c.n)return;return newGame()}
  if(k==="all")CATS.forEach(x=>c.cats.add(x.id));
  if(k==="none")c.cats.clear();
  if(k==="c")c.cats.has(v)?c.cats.delete(v):c.cats.add(v);
  if(k==="n")c.n=+v;if(k==="d")c.d=v;if(k==="t"){c.t=+v;TURN=c.t}
  save();config();
 });
}
function newGame(){
 ac();
 S.all=draw(S.cfg.n);S.deck=shuf(S.all);S.round=0;S.score=[0,0];S.rs=[[0,0],[0,0],[0,0]];S.team=0;S.idx=[0,0];
 intro();
}

/* ---------- partida ---------- */
function board(upto){
 const cell=(t,r)=>{
  if(r>=upto)return `<td class="nil">–</td>`;
  const v=S.rs[r][t],o=S.rs[r][1-t];
  return `<td class="${v>o?"win":""}${r===upto-1?" cur":""}">${v}</td>`;
 };
 return `<table class="board"><thead><tr><th></th>${[1,2,3].map(n=>`<th class="${n===upto?"cur":""}">Ronda ${n}</th>`).join("")}<th>Total</th></tr></thead><tbody>${[0,1].map(t=>`<tr class="t${t}"><th>${TEAMS[t]}</th>${[0,1,2].map(r=>cell(t,r)).join("")}<td class="tot">${S.score[t]}</td></tr>`).join("")}</tbody></table>`;
}
function roundEnd(){
 const n=S.round+1,[a,r]=S.rs[S.round],last=S.round===2;
 const who=a===r?"Empate en esta ronda":a>r?"Gana la ronda el Equipo Azul":"Gana la ronda el Equipo Rojo";
 sfx.round();
 view(`<span class="pill">Ronda ${n} de 3</span><h1>¡Fin de la ronda ${n}!</h1>
 ${board(n)}
 <p style="font-size:1.1rem;text-align:center">${who} (${a} – ${r})</p>
 <button class="btn" id="nr" style="margin-top:auto">${last?"Ver resultado final":"Empezar ronda "+(n+1)}</button>`);
 document.getElementById("nr").onclick=()=>{if(last)final();else{S.round++;S.deck=shuf(S.all);intro()}};
}
function intro(){
 const R=ROUNDS[S.round];
 view(`<div class="newround"><span>RONDA</span><div class="bignum">${S.round+1}</div></div>
 <h1 style="text-align:center">${R.n.split(": ")[1]}</h1><p style="font-size:1.1rem;text-align:center">${R.r}</p>
 <p class="count">${S.deck.length} cartas por acertar</p>${scoreBar()}
 <button class="btn" id="ok" style="margin-top:auto">¡Comenzar la ronda ${S.round+1}!</button>`);
 document.getElementById("ok").onclick=ready;
}
function current(){const l=teamList(S.team);return l[S.idx[S.team]%l.length]}
function ready(){
 document.body.style.setProperty("--tc",TC[S.team]);
 view(`<span class="pill">${ROUNDS[S.round].n}</span>${scoreBar()}
 <div class="hero"><p style="color:#fffc">Pasa el móvil a</p><div class="big">${esc(current().n)}</div><p style="color:#fffc">${TEAMS[S.team]} · ${S.deck.length} cartas por acertar</p></div>
 <p>${ROUNDS[S.round].r}</p>
 <button class="btn" id="st" style="margin-top:auto">Empezar turno (${TURN} s)</button>`);
 document.getElementById("st").onclick=begin;
}
function run(){timer=setInterval(()=>{S.time--;tick(true);if(S.time<=0)end(false)},1000)}
function begin(){
 ac();wake();S.time=TURN;S.turn=[];S.pend=0;S.playing=true;S.paused=false;play();run();
}
function pause(){
 if(!S.playing||S.paused)return;
 S.paused=true;clearInterval(timer);
 const o=document.createElement("div");o.className="overlay";
 o.innerHTML=`<h1 style="text-align:center">Pausa</h1><p style="text-align:center">El tiempo está parado y la carta oculta.</p><button class="btn" id="rs">Continuar</button><button class="btn alt" id="qt">Abandonar partida</button>`;
 $.appendChild(o);
 document.getElementById("rs").onclick=()=>{o.remove();S.paused=false;run()};
 document.getElementById("qt").onclick=()=>{if(confirm("¿Abandonar la partida? Se perderá el marcador.")){S.playing=false;S.paused=false;home()}};
}
document.addEventListener("visibilitychange",()=>{if(document.hidden)pause()});
function play(){
 view(`<div class="top"><span class="who">${esc(current().n)}</span><span class="row2"><button class="mini" id="pz">⏸ Pausa</button><button class="mini" id="snd" aria-label="Activar o silenciar sonido">${S.sound?"🔊":"🔇"}</button></span></div>
 <div class="ring" id="rg"><svg width="132" height="132" viewBox="0 0 120 120"><circle class="bg" cx="60" cy="60" r="54"/><circle class="fg" id="fg" cx="60" cy="60" r="54"/></svg><b id="tm"></b></div>
 <div class="card" id="cd"></div>
 <p class="count" id="ct"></p>
 <div class="acts"><button class="btn bad" id="sk"><span class="ic">✗</span>Pasar<small>${S.round===0?"−5 segundos":"sin penalización"}</small></button><button class="btn good" id="hit"><span class="ic">✓</span>Acertada</button></div>`);
 document.getElementById("hit").onclick=hit;
 document.getElementById("sk").onclick=skip;
 document.getElementById("snd").onclick=e=>{S.sound=!S.sound;e.currentTarget.textContent=S.sound?"🔊":"🔇";save();ac()};
 document.getElementById("pz").onclick=pause;
 tick(false);card();
}
function tick(beepOn){
 const s=Math.max(S.time,0);
 document.getElementById("tm").textContent=s;
 document.getElementById("rg").className="ring"+(s<=10?" low":"");
 document.getElementById("fg").style.strokeDashoffset=339.3*(1-s/TURN);
 if(beepOn&&s>0&&s<=10)sfx.tick(s);
}
function card(){
 const c=document.getElementById("cd");c.textContent=S.deck[0];c.style.fontSize=S.deck[0].length>48?"1.45rem":S.deck[0].length>28?"1.8rem":"";c.classList.remove("pop");void c.offsetWidth;c.classList.add("pop");
 const h=S.turn.filter(t=>t.ok).length;
 document.getElementById("ct").textContent=`Quedan ${S.deck.length-S.pend} cartas · Aciertos en este turno: ${h}`;
}
function hit(){
 S.turn.push({c:S.deck.shift(),ok:true});S.score[S.team]++;S.rs[S.round][S.team]++;
 if(S.deck.length-S.pend<=0)return end(true);
 sfx.hit();vib(15);card();
}
function skip(){
 S.turn.push({c:S.deck[0],ok:false});S.deck.push(S.deck.shift());S.pend++;
 sfx.pass();vib(10);
 if(S.round===0)S.time-=5;
 if(S.time<=0){S.time=0;tick(false);return end(false)}
 if(S.deck.length-S.pend<=0){tick(false);return end(true)}
 tick(false);card();
}
function end(done){
 clearInterval(timer);S.playing=false;vib(done?[60,40,60]:[300]);done?sfx.done():sfx.end();
 const m=new Map();S.turn.forEach(t=>m.set(t.c,m.get(t.c)||t.ok));
 S.res=[...m].map(([c,ok])=>({c,ok}));
 S.idx[S.team]++;
 summary();
}
function summary(){
 const fin=!S.deck.length;
 const label=fin?(S.round<2?"Fin de la ronda":"Ver resultado"):"Pasar el móvil";
 view(`<h1>Fin del turno</h1>${scoreBar()}
 <p>Toca una carta para corregirla si te has equivocado.</p>
 <div class="list">${S.res.map((r,i)=>`<button class="item ${r.ok?"ok":"no"}" data-i="${i}"><span>${esc(r.c)}</span><span class="tag">${r.ok?"✓ Acertada":"✗ Pasada"}</span></button>`).join("")||"<div class=\"item\">No ha dado tiempo a jugar ninguna carta</div>"}</div>
 <button class="btn" id="nx" style="margin-top:auto">${label}</button>`);
 $.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{
  const r=S.res[+b.dataset.i];
  if(r.ok){r.ok=false;S.score[S.team]--;S.rs[S.round][S.team]--;S.deck.push(r.c)}
  else{r.ok=true;S.score[S.team]++;S.rs[S.round][S.team]++;const k=S.deck.indexOf(r.c);if(k>-1)S.deck.splice(k,1)}
  summary();
 });
 document.getElementById("nx").onclick=()=>{
  S.team=1-S.team;
  if(S.deck.length)return ready();
  roundEnd();
 };
}
function confetti(){
 const k=document.createElement("div");k.className="confetti";k.setAttribute("aria-hidden","true");
 k.innerHTML=Array.from({length:28},(_,i)=>`<i style="left:${Math.random()*100}%;animation-delay:${Math.random()*1.5}s;animation-duration:${2.5+Math.random()*2}s">${["🎉","🎊","✨","⭐"][i%4]}</i>`).join("");
 document.body.appendChild(k);setTimeout(()=>k.remove(),6500);
}
function final(){
 const [a,r]=S.score,w=a===r?-1:a>r?0:1;
 document.body.style.setProperty("--tc",w<0?"var(--sol)":TC[w]);
 view(`<div class="hero"><div class="trophy">${w<0?"🤝":"🏆"}</div><div class="big">${w<0?"¡Empate!":"¡Gana el "+TEAMS[w]+"!"}</div><p style="color:#fffc">${a} – ${r}</p></div>${board(3)}
 <button class="btn" id="rp" style="margin-top:auto">Jugar otra vez</button>
 <button class="btn alt" id="sh">Compartir resultado</button>
 <div class="row"><button class="btn alt" id="cf">Secciones</button><button class="btn alt" id="pl">Jugadores</button><button class="btn alt" id="mn">Inicio</button></div>`);
 document.getElementById("rp").onclick=newGame;
 document.getElementById("cf").onclick=config;
 document.getElementById("pl").onclick=setup;
 document.getElementById("mn").onclick=home;
 const sh=document.getElementById("sh");
 sh.onclick=async()=>{
  const t=`¡Acabamos de jugar a Funzy! 🎉 Azul ${a} – ${r} Rojo. ¿Os atrevéis a ganarnos? #Funzy #JuegoDeAdivinar`,u=location.protocol.startsWith("http")?location.href:"";
  try{if(navigator.share)await navigator.share(u?{title:"Funzy",text:t,url:u}:{title:"Funzy",text:t});else{await navigator.clipboard.writeText((t+" "+u).trim());sh.textContent="¡Copiado!"}}catch(e){}
 };
 sfx.done();confetti();
}
load();home();
</script>
</body>
</html>
